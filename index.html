<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Planeswalker Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An ADHD-friendly, interactive beginner's guide to Magic: The Gathering in 14 short levels.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<style>
/* Layout: a quest map of short levels; each level is one focused card at a time with big Back/Next controls. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#E1E6ED; --ink:#1A1F2C; --ink-2:#4A5367; --line:#C9D1DC;
  --accent:#A4521A; --accent-ink:#FFFFFF; --accent-soft:#F5E2D1;
  --good:#1C7A4C; --good-soft:#DCF0E4; --warn:#A8500F; --warn-soft:#FAE6D4;
  --mW:#F2E8C4; --mWi:#5B4A17; --mU:#2C71B5; --mB:#3A3340; --mR:#C93E2A; --mG:#2B824F; --mC:#BDB8AE; --mCi:#26231E;
  --card-border:#16161B; --card-bar:#F3EEE4; --card-ink:#1C1A17; --card-text:#FBF8F1;
  --shadow:0 1px 2px rgb(20 25 40 / .06), 0 10px 28px rgb(20 25 40 / .09);
  --f-display:"Cinzel","Trajan Pro",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --fs:1; --lh:1.6; --ls:0em; --ws:0em;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141B; --surface:#1A1E28; --surface-2:#242A37; --ink:#E9ECF3; --ink-2:#A9B1C3; --line:#333B4C;
    --accent:#EE9F52; --accent-ink:#1A1206; --accent-soft:#3A2A1C;
    --good:#55C98E; --good-soft:#163527; --warn:#F2A06A; --warn-soft:#3D2717;
    --mU:#4A8FD6; --mB:#5A5163; --mR:#E25A43; --mG:#3FA066;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px rgb(0 0 0 / .35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#1A1E28; --surface-2:#242A37; --ink:#E9ECF3; --ink-2:#A9B1C3; --line:#333B4C;
  --accent:#EE9F52; --accent-ink:#1A1206; --accent-soft:#3A2A1C;
  --good:#55C98E; --good-soft:#163527; --warn:#F2A06A; --warn-soft:#3D2717;
  --mU:#4A8FD6; --mB:#5A5163; --mR:#E25A43; --mG:#3FA066;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 28px rgb(0 0 0 / .35);
  color-scheme:dark;
}
html{font-size:calc(100% * var(--fs))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:68rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:1.12rem;letter-spacing:.04em;font-weight:700}
.meter{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.rank{font:700 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.xpbar{width:110px;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s ease}
.xpnum{font:500 .8rem/1 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600}
.tbtn:hover{background:var(--surface-2)}
.tbtn svg{width:16px;height:16px}
.tools{display:flex;gap:8px}
@media (max-width:620px){.xpbar{width:70px}.tbtn span{display:none}.tbtn{padding:8px}.meter{margin-left:0;order:3;width:100%}.tools{margin-left:auto}}

/* ---------- map ---------- */
.hero{padding-block:36px 8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,4.2vw,2.6rem);line-height:1.15;letter-spacing:.01em;max-width:22ch}
.hero p{margin-top:12px;color:var(--ink-2);max-width:56ch}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 20px;font-weight:700;border:2px solid transparent;min-height:48px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hero-art{width:min(230px,34vw)}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero-art{display:none}}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding-block:18px 6px;color:var(--ink-2);font-size:.9rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.section-label{font:700 .74rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);padding-block:22px 12px}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:20px}
.tile{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:transform .15s ease,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--ink-2)}
.tile.next{border:2px solid var(--accent);padding:15px}
.tile .flag{position:absolute;top:-10px;right:12px;background:var(--accent);color:var(--accent-ink);font:700 .68rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:6px}
.sigil{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 1rem/1 var(--f-display);border:2px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.tile.done .sigil{background:var(--sig,var(--accent));color:var(--sig-ink,#fff);border-color:transparent}
.tile h3{font-size:1.02rem;font-weight:700;line-height:1.3}
.tile p{color:var(--ink-2);font-size:.88rem;margin-top:3px;line-height:1.45}
.tile-meta{grid-column:1/-1;display:flex;align-items:center;gap:10px;font:500 .78rem/1 var(--f-mono);color:var(--ink-2)}
.minibar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--good);border-radius:inherit}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warm{background:var(--accent-soft);color:var(--accent)}
.badges{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:40px}
.badge{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;font-weight:600}
.badge .sigil{width:30px;height:30px;font-size:.8rem;background:var(--sig);color:var(--sig-ink,#fff);border:0}
.empty-note{color:var(--ink-2);font-size:.92rem}

/* ---------- level ---------- */
.lvl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.lvl-head h1{font-family:var(--f-display);font-size:1.25rem;font-weight:700;letter-spacing:.02em}
.lvl-head .count{margin-left:auto;font:500 .85rem/1 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:14px}
.dot{width:26px;height:8px;border-radius:99px;background:var(--surface-2);border:0;padding:0}
.dot.seen{background:var(--good)}
.dot.cur{background:var(--accent)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:clamp(18px,4vw,36px);max-width:52rem;margin:0 auto;min-height:340px}
.step{display:grid;gap:18px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:8px;font:700 .74rem/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.step h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.35rem,3vw,1.8rem);line-height:1.2;letter-spacing:.01em}
.key{border-radius:12px;background:var(--accent-soft);padding:14px 16px;font-size:1.08rem;font-weight:600;line-height:1.5;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.key svg{width:22px;height:22px;color:var(--accent);margin-top:2px}
.body{display:grid;gap:12px;max-width:62ch}
.body ul{margin:0;padding-left:1.2em;display:grid;gap:8px}
.body li::marker{color:var(--accent)}
.body strong{font-weight:700}
.note{font-size:.92rem;color:var(--ink-2);border-left:3px solid var(--line);padding-left:12px}
.fix{font-size:.9rem;color:var(--ink-2);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.fix b{color:var(--ink)}
.step-tools{display:flex;gap:8px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:.84rem;font-weight:600;color:var(--ink-2)}
.mini:hover{color:var(--ink);background:var(--surface-2)}
.mini svg{width:15px;height:15px}
.navbar{position:sticky;bottom:0;z-index:5;background:linear-gradient(to top,var(--bg) 70%,transparent);padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));margin-top:8px}
.navbar .inner{max-width:52rem;margin:0 auto;display:flex;gap:12px;align-items:center}
.navbar .btn{flex:1}
.navbar .hint{font:500 .74rem/1.3 var(--f-mono);color:var(--ink-2);text-align:center;max-width:52rem;margin:8px auto 0}
@media (max-width:620px){.navbar .hint{display:none}}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:420px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .72rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* pips */
.pip{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;font:700 .74em/1 var(--f-mono);vertical-align:-.18em;box-shadow:inset 0 -1px 0 rgb(0 0 0 / .28);margin:0 1px;letter-spacing:0}
.p-W{background:var(--mW);color:var(--mWi)} .p-U{background:var(--mU);color:#fff} .p-B{background:var(--mB);color:#fff}
.p-R{background:var(--mR);color:#fff} .p-G{background:var(--mG);color:#fff} .p-N,.p-C{background:var(--mC);color:var(--mCi)}
.p-T{background:var(--mC);color:var(--mCi)}

/* ---------- MTG card graphic (same in both themes: it depicts a physical card) ---------- */
.mtg{--frame:#9b968c;width:13.5rem;max-width:100%;aspect-ratio:63/88;border-radius:12px;border:6px solid var(--card-border);background:var(--frame);padding:7px;display:flex;flex-direction:column;gap:5px;color:var(--card-ink);font-family:var(--f-body);font-size:.74rem;line-height:1.3;box-shadow:0 6px 18px rgb(0 0 0 / .25);position:relative;transition:transform .35s ease;letter-spacing:0;word-spacing:0;flex:none}
.mtg.f-W{--frame:#E7DDBB} .mtg.f-U{--frame:#3E7FBF} .mtg.f-B{--frame:#4A4350} .mtg.f-R{--frame:#C9533C} .mtg.f-G{--frame:#3F8A57} .mtg.f-C{--frame:#A9A397} .mtg.f-L{--frame:#8C7D66}
.mtg-bar{background:var(--card-bar);border-radius:6px;padding:4px 7px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;min-height:1.9em;border:1px solid rgb(0 0 0 / .25)}
.mtg-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtg-cost{white-space:nowrap;display:flex}
.mtg-art{flex:1.1;border-radius:4px;border:1px solid rgb(0 0 0 / .35);position:relative;overflow:hidden;min-height:0}
.mtg-text{flex:1;background:var(--card-text);border-radius:4px;padding:6px 7px;border:1px solid rgb(0 0 0 / .25);display:grid;align-content:start;gap:4px;min-height:0;overflow:hidden}
.mtg-text i{color:#5d574d}
.mtg-pt{position:absolute;right:10px;bottom:6px;background:var(--card-bar);border:1px solid rgb(0 0 0 / .35);border-radius:6px;padding:2px 8px;font:700 .85rem/1.2 var(--f-mono)}
.mtg-loy{position:absolute;right:10px;bottom:6px;width:2.1em;height:2.1em;display:grid;place-items:center;background:#1f1d22;color:#fff;border-radius:50% 50% 45% 45%;font:700 .9rem/1 var(--f-mono)}
.mtg.tapped{transform:rotate(90deg) scale(.86)}
.mtg.lg{width:16.5rem;font-size:.86rem}
.mtg.sm{width:8.5rem;font-size:.6rem;border-width:4px;padding:5px;gap:3px;border-radius:9px}
.mtg.sm .mtg-pt{font-size:.68rem;right:7px;bottom:4px}
.cardrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ---------- widgets ---------- */
.widget{display:grid;gap:16px}
.two{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:640px){.two{grid-template-columns:1fr;justify-items:center}.two>*{width:100%}.two>.mtg{width:15rem}}
.panel{background:var(--surface-2);border-radius:12px;padding:16px;display:grid;gap:8px;min-width:0}
.panel h3{font-size:1.05rem}
.choice-row{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-weight:600;font-size:.93rem;text-align:left;display:inline-flex;align-items:center;gap:8px}
.pick:hover{border-color:var(--ink-2)}
.pick[aria-pressed="true"],.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick.found::after{content:"✓";color:var(--good);font-weight:700}
.pick small{font-weight:400;color:var(--ink-2)}
.feedback{border-radius:12px;padding:12px 14px;font-weight:600;line-height:1.5}
.feedback.ok{background:var(--good-soft);color:var(--good)}
.feedback.no{background:var(--warn-soft);color:var(--warn)}
.feedback.info{background:var(--surface-2);color:var(--ink)}
.feedback>span{display:block;font-weight:400;color:var(--ink);margin-top:4px}
.progress-note{font:500 .8rem/1 var(--f-mono);color:var(--ink-2)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* quiz */
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 15px;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--ink-2)}
.opt .letter{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font:700 .85rem/1 var(--f-mono)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .letter{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.opt[disabled]{cursor:default}

/* anatomy */
.anat .mtg [data-part]{cursor:pointer;outline:0;position:relative}
.anat .mtg [data-part]:hover,.anat .mtg [data-part].on{box-shadow:0 0 0 3px var(--accent)}
.anat .mtg [data-part]:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.anat .num{position:absolute;top:-8px;left:-8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 .7rem/20px var(--f-mono);text-align:center;z-index:2;box-shadow:0 0 0 2px var(--card-border)}
.anat .found .num{background:var(--good);color:#fff}
button.region{all:unset;box-sizing:border-box}

/* mana puzzle */
.lands{display:flex;gap:12px;flex-wrap:wrap;min-height:9rem;align-items:center}
.land-btn{all:unset;cursor:pointer;border-radius:12px}
.land-btn:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.pool{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:2rem;font-size:1.2rem}
.pool .empty{font-size:.9rem;color:var(--ink-2)}

/* phases */
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:640px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}.phases .ph:last-child{grid-column:1/-1}}
.ph{border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:10px;text-align:left;display:grid;gap:3px}
.ph b{font-size:.92rem}
.ph small{font:700 .66rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ph.on{border-color:var(--accent);background:var(--accent-soft)}
.can{display:flex;gap:8px;flex-wrap:wrap}
.can .chip.off{opacity:.5;text-decoration:line-through}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:640px){.slots{grid-template-columns:1fr}}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:6px;font-weight:700;font-size:.9rem;color:var(--ink-2)}
.slot.filled{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good)}

/* combat */
.combat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:640px){.combat{grid-template-columns:1fr}}
.side h3{font:700 .74rem/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.side .choice-row{flex-direction:column}
.side .pick{width:100%;justify-content:space-between}
.pt{font-family:var(--f-mono);font-weight:700}
.kw{font-size:.78rem;font-weight:600;color:var(--accent)}
.log{display:grid;gap:6px;margin:0;padding-left:1.3em}
.lifes{display:flex;gap:12px;flex-wrap:wrap}
.life{flex:1;min-width:140px;background:var(--surface-2);border-radius:12px;padding:10px 14px}
.life small{font:700 .7rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.life b{display:block;font:700 1.6rem/1.2 var(--f-mono);font-variant-numeric:tabular-nums}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.flip{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;min-height:96px;display:grid;align-content:start;gap:6px}
.flip b{font-size:1rem}

/* wheel */

.wheel text{font-family:var(--f-display);font-weight:700}

/* hist / bars */
.bars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:end;height:160px;padding-top:8px}
.bar{display:grid;grid-template-rows:auto 1fr auto;height:100%;gap:4px;text-align:center}

.bar .col{align-self:end;background:var(--surface-2);border-radius:6px 6px 2px 2px;min-height:2px;transition:height .3s ease}

.bar .x{font:700 .74rem/1 var(--f-mono)}
input[type="range"]{width:100%;accent-color:var(--accent)}
.bignum{font:700 2rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.hand{display:flex;flex-wrap:wrap;gap:8px}

/* glossary */
.gl-search{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}

textarea{width:100%;min-height:90px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;resize:vertical;line-height:1.5}

/* drawers / modal */
.scrim{position:fixed;inset:0;background:rgb(10 12 18 / .45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:21;border-left:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;overflow-y:auto;display:grid;gap:18px;align-content:start;box-shadow:var(--shadow)}

.drawer header{display:flex;justify-content:space-between;align-items:center;gap:10px}

.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}

.switch button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:21;width:min(480px,calc(100% - 32px));max-height:calc(100% - 32px);overflow-y:auto;background:var(--surface);border-radius:20px;padding:28px;display:grid;gap:16px;text-align:center;justify-items:center;box-shadow:var(--shadow)}

@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.modal .actions{display:grid;gap:10px;width:100%}
.breath{width:140px;height:140px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font:700 1.6rem/1 var(--f-mono);color:var(--accent);animation:breathe 8s ease-in-out infinite;font-variant-numeric:tabular-nums}
@keyframes breathe{0%,100%{transform:scale(.85)}50%{transform:scale(1.05)}}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;font-size:.92rem;box-shadow:var(--shadow);animation:toast 2.2s ease both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translateY(10px)}12%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}

/* ---------- practice table ---------- */
.pmenu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

.lifebtn small{font:700 .64rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

.pc .ptb{position:absolute;right:3px;bottom:3px;background:var(--card-bar);border:1px solid rgb(0 0 0 / .3);border-radius:3px;padding:1px 4px;font:700 .72rem/1.1 var(--f-mono)}
.pc .txt{background:var(--card-text);border-radius:2px;padding:2px 3px;font-weight:400;font-size:.95em;line-height:1.2}

.coachline{max-width:52rem;margin:0 auto 10px;border-radius:12px;padding:10px 14px;font-size:.92rem;line-height:1.4;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}

<script>
(() => {
"use strict";

/* ================= storage ================= */
const KEY = "pwq-v1";
const DEFAULT = {xp:0, seen:{}, quiz:{}, widgets:{}, done:{}, last:null, notes:"", reflect:{}, gloss:{}, practice:{tutorial:false, wins:0, pz:{}}, settings:{calm:false, size:1, spacing:false, theme:"system"}};
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && typeof s==="object") return Object.assign({}, DEFAULT, s, {settings:Object.assign({}, DEFAULT.settings, s.settings||{})}); }catch(e){} return JSON.parse(JSON.stringify(DEFAULT)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();

/* ================= helpers ================= */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const calm = () => S.settings.calm || matchMedia("(prefers-reduced-motion: reduce)").matches;
const say = t => { const l=$("#live"); l.textContent=""; setTimeout(()=>l.textContent=t,30); };

function pips(cost){
  if(!cost) return "";
  return (cost.match(/\d+|[WUBRGCT]/g)||[]).map(t=>{
    const cls = /\d/.test(t) ? "N" : t;
    const name = {W:"white",U:"blue",B:"black",R:"red",G:"green",C:"colourless",T:"tap"}[t] || "generic";
    return `<span class="pip p-${cls}" role="img" aria-label="${/\d/.test(t)? t+" generic" : name} mana">${t}</span>`;
  }).join("");
}
const P = c => pips(c); // inline helper for content strings

const ART = {
  W:"radial-gradient(circle at 50% 35%,#fffbe8 0 18%,#f1dfa4 19% 30%,#d9c38a 60%,#b8a26a)",
  U:"radial-gradient(circle at 30% 30%,#bfe3ff 0 10%,#5aa2df 30%,#1d4f86 75%)",
  B:"radial-gradient(circle at 60% 40%,#7a6a86 0 10%,#3b3142 40%,#151218 85%)",
  R:"radial-gradient(circle at 50% 80%,#ffd27a 0 12%,#f0743f 35%,#8a2418 80%)",
  G:"radial-gradient(circle at 40% 30%,#d6f2a8 0 10%,#5fae63 35%,#1f5a35 85%)",
  C:"linear-gradient(160deg,#d9d6cf,#8e8a82)",
  L:"linear-gradient(170deg,#c9b99a,#6f6250)"
};
function card(c, cls=""){
  const frame = c.frame || c.color || "C";
  const bottom = c.pt ? `<div class="mtg-pt">${c.pt}</div>` : c.loy ? `<div class="mtg-loy" aria-label="loyalty ${c.loy}">${c.loy}</div>` : "";
  return `<div class="mtg f-${frame} ${cls}" role="img" aria-label="${esc(c.name)}. ${esc(c.type)}. ${esc((c.text||"").replace(/<[^>]+>/g,""))} ${c.pt?"Power and toughness "+c.pt:""}">
    <div class="mtg-bar"><span class="mtg-name">${esc(c.name)}</span><span class="mtg-cost">${pips(c.cost)}</span></div>
    <div class="mtg-art" style="background:${ART[c.art||frame]||ART.C}"></div>
    <div class="mtg-bar"><span class="mtg-name">${esc(c.type)}</span></div>
    <div class="mtg-text">${c.text||""}</div>${bottom}</div>`;
}

const ICON = {
  key:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3l2.6 5.6L20 9.3l-4 4.1 1 5.6-5-2.8-5 2.8 1-5.6-4-4.1 5.4-.7z"/></svg>`,
  speak:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>`,
  back:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`,
  next:`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`,
  map:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>`
};

/* ================= sample cards ================= */
const C = {
  pup:{name:"Emberclaw Pup",cost:"1R",type:"Creature — Dog",text:"<b>Haste</b><i>It was born running.</i>",pt:"2/1",color:"R"},
  mountain:{name:"Mountain",type:"Basic Land — Mountain",text:`${P("T")}: Add ${P("R")}.`,frame:"L",art:"R"},

 {id:"styles", core:1, t:"Playing styles", s:"Aggro, control, ramp, tokens, midrange, combo.", m:4, sig:"✧", c:"var(--mR)", steps:[

   b:`<ul><li><b>Aggro:</b> win fast with cheap attackers.</li><li><b>Control:</b> stop everything, win late.</li><li><b>Midrange:</b> good creatures plus removal, win by trading well.</li><li><b>Ramp:</b> extra mana early, huge creatures sooner.</li><li><b>Tokens (go wide):</b> lots of small creatures, then make them all bigger.</li><li><b>Combo:</b> put specific cards together for a huge effect.</li></ul><p class="note">You can play the first five at the Practice Table. The coach knows each plan.</p>`},

   b:`<div class="tbl-wrap"><table><thead><tr><th>Style</th><th>Usually beats</th><th>Usually loses to</th></tr></thead><tbody>
   <tr><td><b>Aggro</b></td><td>Ramp, Combo (too fast for them)</td><td>Midrange (blocks and removal), big life gain</td></tr>
   <tr><td><b>Control</b></td><td>Ramp, Midrange (answers big threats)</td><td>Aggro (too many cheap threats), Tokens</td></tr>
   <tr><td><b>Midrange</b></td><td>Aggro (trades well)</td><td>Control (outlasted)</td></tr>
   <tr><td><b>Ramp</b></td><td>Midrange (bigger creatures)</td><td>Aggro (too slow), Control (counters the big spell)</td></tr>
   <tr><td><b>Tokens</b></td><td>Control (too many bodies)</td><td>Deathtouch blockers, board wipes</td></tr></tbody></table></div>
   <p class="note">These are tendencies, not rules. A good player with the "wrong" deck can still win.</p>`},

const ROMAN=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV"];
LEVELS.forEach((L,i)=>{ L.n=i; if(i>0) L.sig=ROMAN[i]; L.steps.forEach((s,j)=>s.id=L.id+"-"+j); });

/* ================= XP / ranks ================= */
const RANKS = [[0,"Spark"],[150,"Apprentice"],[400,"Adept"],[750,"Mage"],[1100,"Planeswalker"]];
function rankOf(xp){ let r=RANKS[0], nx=null; for(let i=0;i<RANKS.length;i++){ if(xp>=RANKS[i][0]){ r=RANKS[i]; nx=RANKS[i+1]||null; } } return {name:r[1], floor:r[0], next:nx}; }
function renderMeter(){
  const r = rankOf(S.xp);
  $("#rank").textContent = r.name;
  $("#xpnum").textContent = S.xp + " XP";
  const pct = r.next ? ((S.xp-r.floor)/(r.next[0]-r.floor))*100 : 100;
  $("#xpfill").style.width = Math.max(3,Math.min(100,pct)) + "%";
  $(".meter").setAttribute("aria-label", `Rank ${r.name}, ${S.xp} XP${r.next? ", "+(r.next[0]-S.xp)+" XP to "+r.next[1]:""}`);
}
function award(n, why){
  const before = rankOf(S.xp).name;
  S.xp += n; save(); renderMeter();
  const after = rankOf(S.xp).name;
  if(after!==before) toast(`New rank: ${after}!`); else if(why) toast(`+${n} XP · ${why}`);
}
function toast(msg){
  if(S.settings.calm) return;
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2300);
}

/* ================= settings ================= */
function applySettings(){
  const r=document.documentElement, st=S.settings;
  r.dataset.calm = st.calm ? "on" : "off";
  if(st.theme==="system") r.removeAttribute("data-theme"); else r.dataset.theme = st.theme;
  r.style.setProperty("--fs", st.size);
  r.style.setProperty("--lh", st.spacing ? "1.85" : "1.6");
  r.style.setProperty("--ls", st.spacing ? ".03em" : "0em");
  r.style.setProperty("--ws", st.spacing ? ".12em" : "0em");
}

const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
function stopSpeak(){ try{ if(canSpeak) speechSynthesis.cancel(); }catch(e){} }
function speak(text){
  try{ stopSpeak(); const u=new SpeechSynthesisUtterance(text); u.rate=.95; speechSynthesis.speak(u); }catch(e){}
}

/* ================= routing ================= */
let cur = {view:"map", L:0, i:0};
function go(view, L=0, i=0){
  stopSpeak();
  cur={view,L,i};
  const hash = view==="map" ? "map" : view==="practice" ? "practice" : "level-"+L;
  if(location.hash.slice(1)!==hash){ try{ history.replaceState(null,"","#"+hash); }catch(e){ location.hash=hash; } }
  if(view==="level"){ S.last={L,i}; save(); }
  render();
}
function fromHash(){
  const h=location.hash.slice(1); const m=/^level-(\d+)$/.exec(h);
  if(h==="practice"){ cur={view:"practice",L:0,i:0}; }
  else if(m && LEVELS[+m[1]]){ const L=+m[1]; const i = (S.last && S.last.L===L) ? S.last.i : 0; cur={view:"level",L,i:Math.min(i,LEVELS[L].steps.length-1)}; }
  else cur={view:"map",L:0,i:0};
  render();
}
window.addEventListener("hashchange", fromHash);

/* ================= progress ================= */
const seenCount = L => L.steps.filter(s=>S.seen[s.id]).length;
function suggested(){ const n = LEVELS.find(L=>!S.done[L.id]); return n ? n.n : null; }

  return `<button class="tile ${done?"done":""} ${L.n===target?"next":""}" data-go="${L.n}" style="--sig:${L.c};--sig-ink:${L.ci||"#fff"}" aria-label="Level ${L.n}: ${esc(L.t)}. ${L.m} minutes. ${done?"Done":seen?"In progress":"Not started"}.">
    ${L.n===target?`<span class="flag">Up next</span>`:""}
    <span class="sigil" aria-hidden="true">${L.sig}</span>
    <span><h3>${esc(L.t)}</h3><p>${esc(L.s)}</p></span>
    <span class="tile-meta"><span>${L.m} min</span><span class="minibar" aria-hidden="true"><i style="width:${(seen/tot)*100}%"></i></span>${status}</span>
  </button>`;
}

/* ================= LEVEL VIEW ================= */
function renderLevel(){
  const L=LEVELS[cur.L], st=L.steps[cur.i], tot=L.steps.length;
  if(!S.seen[st.id]){ S.seen[st.id]=1; save(); if(st.k!=="quiz") award(5); }
  const minsLeft = Math.max(1, Math.round(L.m * (tot-cur.i)/tot));
  const dots = L.steps.map((s,j)=>`<button class="dot ${j===cur.i?"cur":S.seen[s.id]?"seen":""}" data-step="${j}" aria-label="Screen ${j+1}${j===cur.i?", current":""}"></button>`).join("");
  const eyebrow = st.k==="quiz" ? "Quick check" : st.k==="widget" ? "Try it" : "Learn";
  const last = cur.i===tot-1;
  $("#view").innerHTML = `
  <div class="wrap">
    <div class="lvl-head">
      <button class="tbtn" data-map>${ICON.map}<span>Map</span></button>
      <h1>Level ${L.n} · ${esc(L.t)}</h1>
      <span class="count">${cur.i+1} / ${tot} · ~${minsLeft} min left</span>
    </div>
    <nav class="dots" aria-label="Screens in this level">${dots}</nav>
    <section class="stage" aria-labelledby="sh">
      <article class="step" id="step">
        <div class="eyebrow">${eyebrow}</div>
        <h2 id="sh" tabindex="-1">${st.h}</h2>
        ${st.key?`<div class="key">${ICON.key}<span>${st.key}</span></div>`:""}
        ${st.b?`<div class="body">${st.b}</div>`:""}
        <div id="slot"></div>
        ${canSpeak?`<div class="step-tools"><button class="mini" id="readBtn">${ICON.speak}Read aloud</button></div>`:""}
      </article>
    </section>
    <div class="navbar"><div class="inner">
      <button class="btn btn-ghost" id="prev" ${cur.i===0?"disabled":""}>${ICON.back} Back</button>
      <button class="btn btn-primary" id="next">${last?"Finish level":(st.k==="quiz" && !S.quiz[st.id]?"Skip":"Next")} ${ICON.next}</button>
    </div><p class="hint">Tip: use the ← → keys. Esc goes back to the map.</p></div>
  </div>`;
  const slot=$("#slot");
  if(st.k==="quiz") renderQuiz(slot, st);
  if(st.k==="widget" && W[st.w]) W[st.w](slot, st);
  $("#prev").onclick=()=>step(-1);
  $("#next").onclick=()=>step(1);
  const rb=$("#readBtn"); if(rb) rb.onclick=()=>speak($("#step").innerText.replace("Read aloud",""));
  $("#sh").focus({preventScroll:true});
}
function step(d){
  const L=LEVELS[cur.L], n=cur.i+d;
  if(n<0) return;
  if(n>=L.steps.length){ finishLevel(L); return; }
  stopSpeak(); cur.i=n; S.last={L:cur.L,i:n}; save(); render(); window.scrollTo({top:0,behavior:calm()?"auto":"smooth"});
}
function finishLevel(L){
  const first = !S.done[L.id];
  S.done[L.id]=1; L.steps.forEach(s=>S.seen[s.id]=1); S.last=null; save();
  if(first) award(50);
  if(first && !calm()) confetti();
  const nx = LEVELS[L.n+1];
  modal(`<span class="sigil" style="--sig:${L.c};--sig-ink:${L.ci||"#fff"}" aria-hidden="true">${L.sig}</span>
    <h2>${esc(L.t)}: done!</h2>
    <p>${first?"Badge earned, +50 XP. ":""}You're ranked <b>${rankOf(S.xp).name}</b> with ${S.xp} XP.</p>
    <p>A short break helps new things stick. Want one?</p>
    <div class="actions">
      ${nx?`<button class="btn btn-primary" data-go="${nx.n}">Next: ${esc(nx.t)}</button>`:""}
      ${L.core&&L.n>=3?`<button class="btn btn-ghost" data-open-table="${S.practice.tutorial?"free":"tutorial"}">Try it at the Practice Table</button>`:""}
      <button class="btn btn-ghost" data-break>Take a 2-minute break</button>
      <button class="btn btn-ghost" data-map>Back to the map</button>
    </div>`);
}

/* ================= quiz ================= */
function renderQuiz(slot, st){
  const rec = S.quiz[st.id];
  slot.innerHTML = `<div class="widget"><p style="font-size:1.12rem;font-weight:600">${st.q}</p><div class="opts">${st.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="letter">${"ABCD"[i]}</span><span>${o[0]}</span></button>`).join("")}</div><div id="fb" aria-live="polite"></div></div>`;
  let tries = 0;
  const showResult = (i) => {
    const o=st.o[i], btn=slot.querySelector(`[data-i="${i}"]`);
    if(o[1]){
      btn.classList.add("right");
      $$(".opt",slot).forEach(b=>b.disabled=true);
      $("#fb",slot).innerHTML=`<div class="feedback ok">Correct!<span>${o[2]}</span></div>`;
      $("#next").innerHTML=(cur.i===LEVELS[cur.L].steps.length-1?"Finish level":"Next")+" "+ICON.next;
    } else {
      btn.classList.add("wrong"); btn.disabled=true; if(!calm()){btn.classList.add("shake");}
      $("#fb",slot).innerHTML=`<div class="feedback no">Not quite, try another.<span>${o[2]}</span></div>`;
    }
  };
  if(rec && rec.done){ const ri=st.o.findIndex(o=>o[1]); showResult(ri); $("#fb",slot).insertAdjacentHTML("beforeend",`<p class="progress-note" style="margin-top:8px">You've answered this one already.</p>`); return; }
  $$(".opt",slot).forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; tries++;
    showResult(i);
    if(st.o[i][1]){ S.quiz[st.id]={done:true, first:tries===1}; save(); award(tries===1?15:5, tries===1?"first try":"got there"); say("Correct"); }
    else say("Not quite");
  });
}

W.combat = (el, st) => {
  const A=[
    {name:"Emberclaw Pup",p:2,t:1,kw:["Haste"]},

    {name:"Thornback Rhino",p:4,t:4,kw:["Trample"]},

    {name:"Sunlit Knight",p:2,t:2,kw:["First strike","Lifelink"]},

  ];
  const B=[
    null,
    {name:"Bark Wall",p:0,t:5,kw:[]},
    {name:"Canopy Spider",p:1,t:3,kw:["Reach"]},
    {name:"Stone Grunt",p:3,t:3,kw:[]},
    {name:"Night Bat",p:1,t:1,kw:["Flying"]}
  ];
  let ai=2, bi=2;
  const row=(c,i,side)=>c?`<button class="pick" data-${side}="${i}"><span>${c.name}${c.kw.length?` <span class="kw">${c.kw.join(", ")}</span>`:""}</span><span class="pt">${c.p}/${c.t}</span></button>`:`<button class="pick" data-${side}="${i}"><span>No block</span><span class="pt">–</span></button>`;
  el.innerHTML=`<div class="widget"><div class="combat">
    <div class="side"><h3>Your attacker</h3><div class="choice-row">${A.map((c,i)=>row(c,i,"a")).join("")}</div></div>
    <div class="side"><h3>Their blocker</h3><div class="choice-row">${B.map((c,i)=>row(c,i,"b")).join("")}</div></div>
  </div><button class="btn btn-primary" id="fight">Fight!</button><div id="cr" aria-live="polite"></div></div>`;
  const mark=()=>{ $$("[data-a]",el).forEach(b=>b.setAttribute("aria-pressed",+b.dataset.a===ai)); $$("[data-b]",el).forEach(b=>b.setAttribute("aria-pressed",+b.dataset.b===bi)); };
  $$("[data-a]",el).forEach(b=>b.onclick=()=>{ai=+b.dataset.a;mark();$("#cr",el).innerHTML="";});
  $$("[data-b]",el).forEach(b=>b.onclick=()=>{bi=+b.dataset.b;mark();$("#cr",el).innerHTML="";});
  mark();
  const tried=new Set();
  $("#fight",el).onclick=()=>{
    const a=A[ai], b=B[bi]; const has=(c,k)=>c&&c.kw.includes(k); const log=[]; let opp=20, me=20;
    if(b && has(a,"Flying") && !has(b,"Flying") && !has(b,"Reach")){
      $("#cr",el).innerHTML=`<div class="feedback no">${b.name} can't block that!<span>${a.name} has Flying. Only creatures with Flying or Reach can block it. Pick another blocker.</span></div>`; return;
    }
    if(!b){
      const strikes = has(a,"Double strike")?2:1; const dmg=a.p*strikes;
      log.push(`No block. ${a.name} hits your opponent for ${a.p}${strikes===2?" twice (Double strike)":""}.`);
      opp-=dmg; if(has(a,"Lifelink")){ me+=dmg; log.push(`Lifelink: you gain ${dmg} life.`); }
    } else {
      const dmgOn={a:0,b:0}, dtHit={a:false,b:false};
      const alive=x=> x==="a" ? !(dmgOn.a>=a.t || dtHit.a) : !(dmgOn.b>=b.t || dtHit.b);
      const deal=(who)=>{
        const src= who==="a"?a:b, tgtKey= who==="a"?"b":"a", tgt= who==="a"?b:a;
        if(src.p<=0){ log.push(`${src.name} has 0 power, so it deals no damage.`); return; }
        let toCreature=src.p, over=0;
        if(who==="a" && has(a,"Trample")){
          const need = has(a,"Deathtouch")?1:Math.max(0,b.t-dmgOn.b);
          toCreature=Math.min(src.p,need); over=src.p-toCreature;
        }
        dmgOn[tgtKey]+=toCreature; if(has(src,"Deathtouch") && toCreature>0) dtHit[tgtKey]=true;
        log.push(`${src.name} deals ${toCreature} damage to ${tgt.name}${has(src,"Deathtouch")&&toCreature>0?" (Deathtouch: that's deadly)":""}.`);
        if(over>0){ opp-=over; log.push(`Trample: the extra ${over} damage goes through to your opponent.`); }
        if(has(src,"Lifelink")){ me+=src.p; log.push(`Lifelink: you gain ${src.p} life.`); }
      };
      const fsA = has(a,"First strike")||has(a,"Double strike"), fsB = has(b,"First strike")||has(b,"Double strike");
      if(fsA||fsB){
        log.push(`<b>First-strike damage step.</b>`);
        if(fsA) deal("a"); if(fsB) deal("b");
        if(!alive("b") && fsA) log.push(`${b.name} is destroyed before it can hit back.`);
        if(!alive("a") && fsB) log.push(`${a.name} is destroyed before it can hit back.`);
        log.push(`<b>Regular damage step.</b>`);
      }
      const regA = alive("a") && (!fsA || has(a,"Double strike"));
      const regB = alive("b") && (!fsB || has(b,"Double strike"));
      if(regA) deal("a"); if(regB) deal("b");
      if(!regA && !regB && (fsA||fsB)) log.push(`Nobody left to deal regular damage.`);
      log.push(`${a.name}: ${alive("a")?"<b>survives</b>":"<b>dies</b>"} (${dmgOn.a} damage on toughness ${a.t}${dtHit.a?", plus Deathtouch":""}).`);
      log.push(`${b.name}: ${alive("b")?"<b>survives</b>":"<b>dies</b>"} (${dmgOn.b} damage on toughness ${b.t}${dtHit.b?", plus Deathtouch":""}).`);
    }
    $("#cr",el).innerHTML=`<div class="panel"><h3>What happened</h3><ol class="log">${log.map(l=>`<li>${l}</li>`).join("")}</ol>
      <div class="lifes"><div class="life"><small>Opponent life</small><b>20 → ${opp}</b></div><div class="life"><small>Your life</small><b>20 → ${me}</b></div></div></div>`;
    tried.add(ai+"-"+bi); if(tried.size>=3) markWidget(st.id,15);
  };
};

function comb(n,k){ if(k<0||k>n) return 0; k=Math.min(k,n-k); let r=1; for(let i=1;i<=k;i++) r=r*(n-k+i)/i; return r; }
function hyper(N,K,n,k){ return comb(K,k)*comb(N-K,n-k)/comb(N,n); }

    $$("[data-k]",el).forEach(b=>b.onclick=()=>{

      $("#kf",el).innerHTML=`<div class="feedback ${pick===keep?"ok":"no"}">${pick===keep?"Good call.":"Most players would "+(keep?"keep":"mulligan")+" this one."}<span>${why}</span></div><div class="choice-row" style="margin-top:10px"><button class="pick" id="deal">Deal another hand</button></div>`;

function threat(c,target,caster){
  const d=D(c), foe=G.pl[other(caster)];
  if(d.t==="creature"){ const base=(d.p||0)+(d.th||0)+anthems(caster)*2+(kw(c,"Flying")?2:0)+(kw(c,"Deathtouch")?2:0)+(kw(c,"Trample")?1:0)+(d.etb?2:0); return base; }
  switch(d.fx){
    case "kill": case "bounce": return target&&target.card&&target.card.o!==caster?val(target.card):0;
    case "dmg3": return target&&target.player&&foe.life<=3?99:target&&target.card?val(target.card):3;
    case "drain2": return foe.life<=2?99:3;
    case "anthem": return 3+2*G.pl[caster].bf.filter(isCre).length;
    case "tokens2": return 5;
    case "reanimate": { const g=G.pl[caster].gy.filter(isCre).sort((a,b)=>val(b)-val(a))[0]; return g?val(g):0; }
    case "teampump": return 2*G.pl[caster].bf.filter(ableAtk).length;
    default: return 3;
  }
}

/* --- casting --- */
function youCanCounter(){ return G.pl.you.hand.some(c=>D(c).fx==="counter")&&canAfford("you","denial"); }
function botCanCounter(){ return G.pl.bot.hand.some(c=>D(c).fx==="counter")&&canAfford("bot","denial"); }
function castYou(c,target){
  const Y=G.pl.you, B=G.pl.bot; pay(Y.pool,c.k); Y.hand.splice(Y.hand.indexOf(c),1); G.pending=null;
  log(`You cast <b>${nm(c)}</b>${target?(target.player?` at ${target.player==="you"?"yourself":"your opponent"}`:` targeting ${nm(target.card)}`):""}.`);
  prowess("you",c);
  if(botCanCounter()&&threat(c,target,"you")>=6){
    const dn=B.hand.find(x=>D(x).fx==="counter"); autoTap("bot","denial"); pay(B.pool,"denial"); B.hand.splice(B.hand.indexOf(dn),1); B.gy.push(dn); Y.gy.push(c);
    log(`Opponent responds with <b>Quick Denial</b>: your ${nm(c)} is countered and goes to your graveyard.`); cue("countered"); prowess("bot",dn); paint(); return;
  }

}
function botChoose(){
  const B=G.pl.bot, Y=G.pl.you, opts=[];
  const reserve=B.hand.some(c=>D(c).fx==="counter")&&G.step==="main2"||(B.hand.some(c=>D(c).fx==="counter")&&B.bf.some(isCre));
  for(const c of B.hand){ const d=D(c); if(isLand(c)||d.fx==="counter"||d.fx==="pump3"||!canAfford("bot",c.k)) continue;
    if(reserve&&B.hand.some(x=>D(x).fx==="counter")&&!canAffordBoth("bot",c.k,"denial")) continue;
    let s=0, target=null;
    switch(d.fx){
      case "kill": case "bounce": { const t=Y.bf.filter(isCre).sort((a,b)=>val(b)-val(a))[0]; if(t&&val(t)>=(d.fx==="kill"?4:7)){ s=10+val(t); target={card:t}; } break; }
      case "dmg3": if(Y.life<=3){ s=100; target={player:"you"}; } else { const t=Y.bf.filter(x=>isCre(x)&&tg(x)-x.dmg<=3).sort((a,b)=>val(b)-val(a))[0]; if(t&&val(t)>=4){ s=8+val(t); target={card:t}; } else if(styleOf("bot")==="aggro"&&B.hand.filter(isCre).length===0){ s=1; target={player:"you"}; } } break;
      case "drain2": s=Y.life<=2?100:3; break;
      case "anthem": s=B.bf.filter(isCre).length>=2?12:1; break;
      case "tokens2": s=7; break;
      case "ramp": s=B.bf.filter(isLand).length<6?9:1; break;
      case "reanimate": { const g=B.gy.filter(isCre).sort((a,b)=>val(b)-val(a))[0]; if(g&&val(g)>=5) s=6+val(g); break; }
      case "draw2": s=G.step==="main2"?2:0; break;
      case "teampump": { const at=B.bf.filter(ableAtk), bl=Y.bf.filter(x=>isCre(x)&&!x.tapped); if(G.step==="main1"&&at.length>=2&&at.reduce((a,x)=>a+pw(x)+2,0)-bl.length*3>=Y.life) s=50; break; }
      default: if(d.t==="creature") s=5+mv(c.k)+(d.mana&&G.turn<8?4:0);
    }

}
function botMainStep(){
  if(G.over) return; const B=G.pl.bot; G.busy=false;

  const ch=botChoose();
  if(!ch){ nextStep(); return; }
  const c=ch.card; autoTap("bot",c.k); pay(B.pool,c.k); B.hand.splice(B.hand.indexOf(c),1);
  log(`Opponent casts <b>${nm(c)}</b>${isCre(c)?` (${(D(c).p)}/${(D(c).th)}${D(c).kw.length?", "+D(c).kw.join(", "):""})`:""}${ch.target?(ch.target.player?" at you":` targeting your ${nm(ch.target.card)}`):""}.`);
  prowess("bot",c);
  if(youCanCounter()){ G.stack={c,target:ch.target}; G.respond=true; cue("respond"); paint(); return; }
  resolveSpell(c,"bot",ch.target); paint(); if(!G.over){ G.busy=true; later(botMainStep,800); }
}
function botPlayLand(){ const B=G.pl.bot; const lands=B.hand.filter(isLand); if(!lands.length) return;
  const need={}, have={}; COLS.forEach(x=>{need[x]=0;have[x]=0;}); B.hand.filter(c=>!isLand(c)).forEach(c=>{const k=costOf(c.k); COLS.forEach(x=>need[x]+=k[x]);}); B.bf.filter(isLand).forEach(l=>have[D(l).c]++);
  const L=[...lands].sort((a,b)=>(need[D(b).c]-have[D(b).c])-(need[D(a).c]-have[D(a).c]))[0];
  B.hand.splice(B.hand.indexOf(L),1); B.bf.push(L); B.land=true; log(`Opponent plays ${nm(L)}.`); }
function botAttack(){
  const B=G.pl.bot, Y=G.pl.you, aggro=styleOf("bot")==="aggro";

  const blockers=Y.bf.filter(c=>isCre(c)&&!c.tapped);
  let att=cands.filter(a=>{ const able=blockers.filter(b=>canBlock(b,a)); return !able.some(b=>kills(b,a)&&(!kills(a,b)||!aggro)); });

}
function botBlock(){
  const B=G.pl.bot; G.blocks={}; const used=new Set();

  const free=()=>B.bf.filter(c=>isCre(c)&&!c.tapped&&!used.has(c.id));
  atks.forEach(a=>{ const able=free().filter(b=>canBlock(b,a));

function combatDamage(){
  const d=other(G.active);

  const live=c=>c&&!c.gone&&onBf(c);
  const anyFs=pairs.some(p=>fsK(p.at)||(live(p.bl)&&fsK(p.bl)));
  const pass=first=>{
    const ok=c=>live(c)&&(first?fsK(c):(!fsK(c)||kw(c,"Double strike")));
    const hits=[];
    pairs.forEach(p=>{ const at=p.at, bl=p.bl;
      if(ok(at)){ const n=pw(at);
        if(!bl) hits.push(()=>dmgPlayer(d,n,at));
        else if(!live(bl)){ if(kw(at,"Trample")) hits.push(()=>dmgPlayer(d,n,at,true)); else if(n>0) hits.push(()=>log(`${nm(at)} was blocked, and its blocker is gone, so it deals no damage.`)); }

    });

  };

  pass(false);
}

function bestBlocks(){ // greedy plan the coach would use when defending
  const Y=G.pl.you, atks=G.atk.map(find).filter(Boolean).sort((a,b)=>pw(b)-pw(a)), mine=Y.bf.filter(c=>isCre(c)&&!c.tapped), used=new Set(), plan=[];
  atks.forEach(a=>{ const g=mine.find(b=>!used.has(b.id)&&canBlock(b,a)&&kills(b,a)&&!kills(a,b)); if(g){ plan.push([a,g,"good"]); used.add(g.id); } });
  atks.forEach(a=>{ if(plan.some(p=>p[0]===a)) return; const t=mine.filter(b=>!used.has(b.id)&&canBlock(b,a)&&kills(b,a)&&val(b)<val(a)).sort((x,y)=>val(x)-val(y))[0]; if(t){ plan.push([a,t,"trade"]); used.add(t.id); } });
  atks.forEach(a=>{ if(plan.some(p=>p[0]===a)) return; const w=mine.find(b=>!used.has(b.id)&&canBlock(b,a)&&!kills(a,b)&&!kw(a,"Trample")); if(w){ plan.push([a,w,"wall"]); used.add(w.id); } });
  let inc=atks.filter(a=>!plan.some(p=>p[0]===a)).reduce((s,a)=>s+pw(a),0);
  atks.forEach(a=>{ if(inc<Y.life||plan.some(p=>p[0]===a)) return; const ch=mine.filter(b=>!used.has(b.id)&&canBlock(b,a)).sort((x,y)=>val(x)-val(y))[0]; if(ch){ plan.push([a,ch,"chump"]); used.add(ch.id); inc-=kw(a,"Trample")?Math.min(pw(a),tg(ch)):pw(a); } });
  return {plan,inc};
}
function safeAttackers(){ const B=G.pl.bot, bl=B.bf.filter(c=>isCre(c)&&!c.tapped); return G.pl.you.bf.filter(canAttack).filter(a=>pw(a)>0&&!bl.some(b=>canBlock(b,a)&&kills(b,a))); }
function lethalAttack(ids,without){ const B=G.pl.bot, at=ids.map(find).filter(Boolean).sort((a,b)=>pw(b)-pw(a)); const bl=B.bf.filter(c=>isCre(c)&&!c.tapped&&c!==without); let n=bl.length; let dmg=0; at.forEach(a=>{ const blockable=bl.some(b=>canBlock(b,a)); if(n>0&&blockable){ n--; if(kw(a,"Trample")) dmg+=Math.max(0,pw(a)-3); } else dmg+=pw(a); }); return dmg>=B.life; }

      case "dmg3": if(B.life<=3){ s=100; w="3 damage to your opponent wins the game right now."; } else { const t=B.bf.filter(x=>isCre(x)&&tg(x)-x.dmg<=3).sort((x,y)=>val(y)-val(x))[0]; if(t&&val(t)>=5){ s=12; w=`Their ${nm(t)} is a real threat, and 3 damage destroys it.`; } } break;
      case "kill": { const t=B.bf.filter(isCre).sort((x,y)=>val(y)-val(x))[0]; if(t&&val(t)>=5){ s=14+val(t); w=`Their ${nm(t)} is their biggest threat. Removal clears the way.`; } break; }
      case "bounce": { const t=B.bf.filter(isCre).sort((x,y)=>val(y)-val(x))[0]; if(t&&val(t)>=8&&st!=="control"){ s=9; w=`Their ${nm(t)} is huge. Sending it back to their hand costs them a whole turn of mana.`; } break; }

      case "tokens2": s=9; w="Two bodies for one card. Great with Banner of Unity."; break;
      case "reanimate": { const g=Y.gy.filter(isCre).sort((x,y)=>val(y)-val(x))[0]; if(g&&val(g)>=5){ s=11; w=`Brings ${nm(g)} back for free value.`; } break; }
      case "drain2": s=B.life<=2?100:2; w=B.life<=2?"Your opponent loses 2: that's lethal!":"Some free damage and life."; break;
      case "teampump": if(G.step==="main1"&&Y.bf.filter(canAttack).length>=2){ s=8; w="Cast it before combat so all your attackers hit harder."; } break;

      default: if(d.t==="creature"){ const hasteNow=kw(c,"Haste")&&G.step==="main1"; s=6+mv(c.k)+(d.mana&&G.turn<8?4:0)+(hasteNow?3:0); w=d.mana?"A mana creature: extra mana every turn from next turn.":hasteNow?"It has Haste, so it can attack this very turn.":`Your strongest creature you can afford. Using your mana every turn is how you get ahead.`; }

}
function review(kind,data){

  if(kind==="mull"){ const l=Y.hand.filter(isLand).length; if(l>=2&&l<=5) w.push(`This hand has ${l} lands and ${7-l} spells. That's keepable, and a mulligan costs you a card.`); }

    const cast=Y.hand.filter(c=>["creature","enchantment"].includes(D(c).t)||["tokens2","ramp"].includes(D(c).fx)).filter(c=>canAfford("you",c.k));
    if(cast.length&&!holding) w.push(`You could still cast ${names(cast)}. Mana you don't use this turn is wasted.`);

    if(!at.length){ const s=safeAttackers(); if(s.length) w.push(`${names(s)} could attack safely: none of their untapped creatures can block and destroy ${s.length>1?"them":"it"}.`); }
    else if(!lethalAttack(ids)){
      at.forEach(a=>{ const b=bl.find(b=>canBlock(b,a)&&kills(b,a)&&!kills(a,b)); if(b&&!(st==="aggro"&&false)) w.push(`If their ${nm(b)} blocks your ${nm(a)}, yours dies and theirs survives. That's a free kill for them.`); });
      const theirPower=B.bf.filter(c=>isCre(c)&&!kw(c,"Defender")).reduce((s,c)=>s+pw(c),0), home=Y.bf.filter(c=>isCre(c)&&!c.tapped&&(!ids.includes(c.id)||kw(c,"Vigilance")));

    }

  if(kind==="blocks"){
    const atks=G.atk.map(find).filter(Boolean); const inc=atks.filter(a=>G.blocks[a.id]==null).reduce((s,a)=>s+pw(a),0);
    if(inc>=Y.life) w.push(`You'll take ${inc} damage and you're on ${Y.life} life. That's lethal! Block something, even if your creature dies.`);
    Object.entries(G.blocks).forEach(([aid,bid])=>{ const a=find(+aid), b=find(bid); if(!a||!b) return;
      if(kills(a,b)&&!kills(b,a)&&inc+pw(a)<Y.life) w.push(`Your ${nm(b)} would die and their ${nm(a)} survives. Without that block you'd only take ${pw(a)} more, so save your creature.`); });
    const used=new Set(Object.values(G.blocks));
    atks.filter(a=>G.blocks[a.id]==null).forEach(a=>{ const g=Y.bf.find(b=>isCre(b)&&!b.tapped&&!used.has(b.id)&&canBlock(b,a)&&kills(b,a)&&!kills(a,b)); if(g) w.push(`Your ${nm(g)} could block ${nm(a)}, destroy it and survive. That's a free kill you're missing.`); });
  }
  if(kind==="cast"){
    const c=data.c, t=data.t, d=D(c);
    if(t&&t.card&&t.card.o==="you"&&["dmg3","kill","bounce"].includes(d.fx)) w.push(`That's your own ${nm(t.card)}! ${d.n} would hurt you, not your opponent.`);
    if(t&&t.player==="you") w.push("You're aiming Spark Jolt at yourself! Target your opponent or one of their creatures.");
    if(t&&t.card&&t.card.o==="bot"&&d.fx==="pump3") w.push(`That makes their ${nm(t.card)} bigger! Target your own creature.`);
    if(t&&t.card&&t.card.o==="bot"&&d.fx==="dmg3"&&tg(t.card)-t.card.dmg>3) w.push(`3 damage won't destroy ${nm(t.card)}: it has ${tg(t.card)-t.card.dmg} toughness left. Damage only destroys a creature when it reaches its toughness.`);
    if(d.fx==="pump3"&&G.step!=="block") w.push("Wild Surge only lasts until end of turn. It's strongest in combat, after blockers are chosen, when it can win a fight.");
    if(d.fx==="teampump"&&(G.step!=="main1"||!Y.bf.some(canAttack))) w.push(G.step!=="main1"?"Reckless Charge only helps attackers, and combat is over. Cast it in Main phase 1, before you attack.":"None of your creatures can attack this turn, so Reckless Charge does nothing useful.");
    if(d.fx==="reanimate"&&!Y.gy.some(isCre)) w.push("There's no creature in your graveyard, so Grave Return would do nothing.");
    if(d.fx==="anthem"&&!Y.bf.some(isCre)) w.push("You have no creatures yet, so Banner of Unity does nothing right now. Usually you cast creatures first.");
    if(d.fx==="draw2"&&st==="control"&&G.active==="you"&&Y.hand.some(x=>D(x).fx==="counter")&&!canAffordBoth("you","study","denial")) w.push("Casting Deep Study now taps the mana you need for Quick Denial on their turn.");
    if(d.t==="creature"){ const a=avail("you"); const bigger=Y.hand.filter(x=>x!==c&&isCre(x)&&mv(x.k)>mv(c.k)&&canPay(a,x.k)&&!canPayC(a,sumCost(c.k,x.k))); if(bigger.length&&!(st==="ramp"&&D(c).mana)) w.push(`You can only afford one of these. ${nm(bigger[0])} is stronger than ${nm(c)}.`); }
    if(t&&t.player==="bot"&&d.fx==="dmg3"&&B.life>3&&st!=="aggro"){ const th=B.bf.filter(x=>isCre(x)&&tg(x)-x.dmg<=3).sort((x,y)=>val(y)-val(x))[0]; if(th&&val(th)>=5) w.push(`Their ${nm(th)} would die to Spark Jolt. Removing a threat is usually better than 3 damage to the face, unless you're racing.`); }
  }
  if(kind==="counter"&&threat(G.stack.c,G.stack.target,"bot")<5) w.push(`${nm(G.stack.c)} is a small threat. Quick Denial is precious. Save it for a big creature or a removal spell.`);
  if(kind==="pass"&&threat(G.stack.c,G.stack.target,"bot")>=7) w.push(`${nm(G.stack.c)} is a big threat, and you have Quick Denial ready. This is exactly what it's for.`);
  return w;
}
function commit(kind,data,fn){
  const w=G.checks?review(kind,data):[];

}

function castTiming(c){ const d=D(c), my=G.active==="you", main=G.step==="main1"||G.step==="main2";

  if(d.t==="instant"){ if((my&&main)||(G.step==="block"&&G.blocksDone)) return true; return "On this table, instants work in your main phases, or in combat once blockers are chosen."; }
  if(!my||!main) return `${{creature:"Creatures",sorcery:"Sorceries",enchantment:"Enchantments"}[d.t]} can only be cast in your own main phase${G.step==="block"?". Right now, only instants work":""}.`;
  return true; }
const idle=()=>!G.over&&!G.busy&&!G.mull&&!G.discard&&!G.paused&&!G.respond&&!G.warn;

function chooseTarget(t){ const sp=G.pl.you.hand.find(x=>x.id===G.pending.id); const spec=TGT[D(sp).fx];

function clickPlayer(w){ if(!G.pending) return; chooseTarget({player:w}); }

function act(a,el){
  if(a==="new-tutorial"){ closeLayer(); newGame("tutorial"); return; }

  if(a==="pick-opp"){ S.practice.opp=el.dataset.deck; save(); paint(); return; }
  if(a==="pz"){ closeLayer(); newGame("puzzle",{pz:+el.dataset.pz}); return; }
  if(a==="again"){ closeLayer(); newGame(G.mode,{pz:G.pz,you:G.pl.you.deck,bot:S.practice.opp||"random"}); return; }
  if(a==="menu"){ closeLayer(); tableOpen=false; paint(); return; }
  if(a==="resume"){ tableOpen=true; paint(); return; }
  if(!G) return;

    case "warn-back": G.warn=null; G.pending=null; log("You changed your move."); break;
    case "mull": commit("mull",null,()=>{ Y.lib=shuffle(Y.lib.concat(Y.hand)); Y.hand=Y.lib.splice(0,7); G.mull.n++; log(`You mulligan (${G.mull.n}). New 7 cards.`); paint(); }); return;
    case "keep": commit("keep",null,()=>{ if(G.mull.n>0){ G.mull.stage="bottom"; paint(); } else { log("You keep your hand."); startGame(); } }); return;
    case "bottom-ok": if(G.mull.sel.size!==G.mull.n) break; [...G.mull.sel].forEach(id=>{ const c=Y.hand.find(x=>x.id===id); Y.hand.splice(Y.hand.indexOf(c),1); Y.lib.push(c); }); log(`You keep, putting ${G.mull.n} card${G.mull.n>1?"s":""} on the bottom.`); startGame(); return;
    case "combat": setStep("attack"); return;
    case "endturn": commit("endturn",null,()=>setStep("end")); return;
    case "attack": { const ids=[...G.atkSel].filter(id=>{const c=find(id); return c&&canAttack(c);}); commit("attack",ids,()=>doAttack(ids)); return; }
    case "confirm-blocks": commit("blocks",null,doBlocks); return;
    case "damage": nextStep(); return;

}

function actions(){
  if(G.over) return [{t:"Play again",a:"again",p:1}];
  if(G.warn) return [{t:"Do it anyway",a:"warn-go"},{t:"Change my move",a:"warn-back",p:1}];
  if(G.mull) return G.mull.stage==="bottom"?[{t:`Put ${G.mull.n} on the bottom`,a:"bottom-ok",p:1,dis:G.mull.sel.size!==G.mull.n}]:[{t:"Mulligan",a:"mull"},{t:"Keep this hand",a:"keep",p:1}];
  if(G.respond) return [{t:"Let it resolve",a:"pass"},{t:"Counter it",a:"counter",p:1}];
  if(G.busy) return [{t:"Opponent is playing…",a:"",p:1,dis:1}];
  if(G.discard) return [{t:`Discard ${G.pl.you.hand.length-7} more`,a:"",p:1,dis:1}];
  if(G.pending) return [{t:"Cancel spell",a:"cancel"}];
  if(G.paused) return [{t:"Continue",a:"continue",p:1}];
  const my=G.active==="you";
  if(my&&G.step==="main1") return [{t:"End turn",a:"endturn"},{t:"Go to combat",a:"combat",p:1}];
  if(my&&G.step==="main2") return [{t:"End turn",a:"endturn",p:1}];
  if(my&&G.step==="attack") return [{t:G.atkSel.size?`Attack with ${G.atkSel.size}`:"Don't attack",a:"attack",p:1}];
  if(G.step==="block"&&G.blocksDone) return [{t:"Deal damage",a:"damage",p:1}];
  if(!my&&G.step==="block"){ const n=Object.keys(G.blocks).length; return [{t:n?`Confirm ${n} block${n>1?"s":""}`:"No blocks",a:"confirm-blocks",p:1}]; }
  return [{t:"Waiting…",a:"",p:1,dis:1}];
}

/* --- rendering --- */
function pcard(c,zone){
  const d=D(c), hand=zone==="hand", land=d.t==="land";
  const cls=["pc"]; if(land&&!hand) cls.push("land"); if(c.tapped&&!hand) cls.push("tap"); if(d.token) cls.push("token");
  if(hand){ if(G.mull&&G.mull.sel.has(c.id)) cls.push("sel"); else if(handCan(c)||G.discard) cls.push("can"); if(G.pending&&G.pending.id===c.id) cls.push("sel"); }
  else {
    if(G.pending&&isCre(c)) cls.push("tgt");
    if(G.atk.includes(c.id)&&["attack","block","damage"].includes(G.step)) cls.push("atk");
    if(c.o==="you"&&G.active==="you"&&G.step==="attack"&&idle()){ if(G.atkSel.has(c.id)) cls.push("atk"); else if(canAttack(c)) cls.push("can"); }
    if(G.step==="block"&&G.active==="bot"&&!G.blocksDone&&idle()){
      if(c.o==="you"&&isCre(c)&&!c.tapped) cls.push(G.selBlocker===c.id?"sel":"can");
      if(c.o==="bot"&&G.selBlocker&&G.atk.includes(c.id)&&canBlock(find(G.selBlocker),c)) cls.push("tgt"); }
    if(c.o==="you"&&(land||(d.mana&&!c.sick))&&!c.tapped&&idle()&&!G.pending&&!(G.step==="attack"&&G.active==="you")) cls.push("tapme");
    if(G.inspect===c.id) cls.push("sel");
  }
  const label=`${d.n}${d.token?" token":""}${d.cost?", costs "+mv(c.k):""}${isCre(c)?`, ${pw(c)}/${tg(c)}`:""}${(d.kw||[]).length?", "+d.kw.join(", "):""}${c.tapped&&!hand?", tapped":""}`;
  const attr=hand?`data-hand="${c.id}"`:`data-perm="${c.id}"`;
  if(land&&!hand) return `<button class="${cls.join(" ")}" style="--frame:${FR.L}" ${attr} aria-label="${label}"><span class="ar lnd" style="background:${ART[d.c]}">${pips(d.c)}</span></button>`;
  const line=isCre(c)?`<span class="kwl">${[...(d.kw||[]),d.mana?"T: add "+d.mana:"",d.etb?"Makes a token":""].filter(Boolean).join(", ")}</span><span class="ptb">${pw(c)}/${tg(c)}</span>`:(hand||d.t==="enchantment")&&d.txt?`<span class="txt">${d.t==="instant"?"Instant. ":d.t==="sorcery"?"Sorcery. ":""}${d.txt}</span>`:"";
  return `<button class="${cls.join(" ")}" style="--frame:${FR[land?"L":d.c]}" ${attr} aria-label="${label}"><span class="nb"><span>${d.n}</span><span class="cs">${pips(d.cost)}</span></span><span class="ar" style="background:${ART[d.c]}"></span>${line}</button>`;
}
function cell(c){
  const tags=[];
  if(isCre(c)){
    if(c.o==="you"&&G.active==="you"&&c.sick&&!kw(c,"Haste")) tags.push(`<span class="tagx">New</span>`);
    if(G.atk.includes(c.id)&&["attack","block","damage"].includes(G.step)) tags.push(`<span class="tagx">Attacking</span>`);
    const blk=Object.keys(G.blocks).find(a=>G.blocks[a]===c.id); if(blk!=null&&["block","damage"].includes(G.step)) tags.push(`<span class="tagx">Blocks ${esc(nm(find(+blk)))}</span>`);
    if(c.dmg>0) tags.push(`<span class="tagx b dmg">${c.dmg} dmg</span>`); else if(c.pp) tags.push(`<span class="tagx b">+${c.pp}/+${c.pt}</span>`);
  }
  return `<div class="cell ${isLand(c)?"l":""}">${pcard(c,"bf")}${tags.join("")}</div>`;
}
function zoneRow(list,empty){ return list.length?list.map(cell).join(""):`<span class="emptyz">${empty}</span>`; }
function lifeBtn(w){ const sp=G.pending&&G.pl.you.hand.find(x=>x.id===G.pending.id); const t=sp&&TGT[D(sp).fx]==="any"; return `<button class="lifebtn ${t?"tgt":""}" data-player="${w}" aria-label="${w==="you"?"Your":"Opponent's"} life: ${G.pl[w].life}${t?". Target this player.":""}"><small>Life</small><b>${G.pl[w].life}</b></button>`; }

    $("#sc",el).textContent=seen.size===6?"You've seen every style.":`${seen.size} of 6 styles viewed`; if(seen.size===6) markWidget(st.id); };

      <div class="setting"><span style="font-weight:700">Text size</span><div class="seg" role="group" aria-label="Text size">${[[.9,"Smaller"],[1,"Normal"],[1.15,"Large"],[1.3,"Largest"]].map(o=>`<button data-size="${o[0]}" aria-pressed="${st.size===o[0]}">${o[1]}</button>`).join("")}</div></div>
      <div class="setting"><div class="switch"><span id="spL">Extra spacing</span><button role="switch" id="spS" aria-labelledby="spL" aria-checked="${st.spacing}"></button></div><p>More room between lines, letters and words. Many people find this easier to read.</p></div>
      <div class="setting"><span style="font-weight:700">Theme</span><div class="seg" role="group" aria-label="Theme">${[["system","Auto"],["light","Light"],["dark","Dark"]].map(o=>`<button data-theme-set="${o[0]}" aria-pressed="${st.theme===o[0]}">${o[1]}</button>`).join("")}</div></div>
      <div class="setting" style="border:0"><span style="font-weight:700">Start over</span><p>Clears your XP, badges and notes on this device.</p><div id="resetBox"><button class="btn btn-ghost" id="reset1">Reset progress…</button></div></div>
    </aside>`;
    const lay=$("#layer");
    $("#calmS",lay).onclick=e=>{ S.settings.calm=!S.settings.calm; e.currentTarget.setAttribute("aria-checked",S.settings.calm); save(); applySettings(); };
    $("#spS",lay).onclick=e=>{ S.settings.spacing=!S.settings.spacing; e.currentTarget.setAttribute("aria-checked",S.settings.spacing); save(); applySettings(); };
    $$("[data-size]",lay).forEach(b=>b.onclick=()=>{ S.settings.size=+b.dataset.size; $$("[data-size]",lay).forEach(x=>x.setAttribute("aria-pressed",x===b)); save(); applySettings(); });
    $$("[data-theme-set]",lay).forEach(b=>b.onclick=()=>{ S.settings.theme=b.dataset.themeSet; $$("[data-theme-set]",lay).forEach(x=>x.setAttribute("aria-pressed",x===b)); save(); applySettings(); });
    $("#reset1",lay).onclick=()=>{ $("#resetBox",lay).innerHTML=`<p style="font-weight:700;color:var(--warn)">This can't be undone. Are you sure?</p><div class="choice-row"><button class="btn btn-primary" id="reset2">Yes, reset</button><button class="btn btn-ghost" data-close>Keep my progress</button></div>`; $("#reset2",lay).onclick=()=>{ const keep=S.settings; S=JSON.parse(JSON.stringify(DEFAULT)); S.settings=keep; save(); closeLayer(); renderMeter(); go("map"); }; };
    $("#calmS",lay).focus();
  } else {
    $("#layer").innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh">
      <header><h2 id="dh">Thought parking lot</h2><button class="tbtn" data-close>Close</button></header>
      <p style="color:var(--ink-2)">Brain wandered off? Write it down here so you can let it go and come back to it later. Questions about the rules, things to look up, anything.</p>
      <label class="sr" for="notes">Your parked thoughts</label><textarea id="notes" style="min-height:260px" placeholder="e.g. Ask at the store: what's a good first Commander precon?">${esc(S.notes)}</textarea>
      <p class="progress-note" id="ns">Saves automatically on this device.</p></aside>`;
    const t=$("#notes"); t.oninput=()=>{ S.notes=t.value; save(); $("#ns").textContent="Saved."; }; t.focus();
  }
}

/* ================= confetti ================= */
function confetti(){
  const cv=document.createElement("canvas"); cv.id="fx"; document.body.appendChild(cv);
  const dpr=window.devicePixelRatio||1; cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; const x=cv.getContext("2d"); x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement); const cols=["--mW","--mU","--mB","--mR","--mG","--accent"].map(v=>cs.getPropertyValue(v).trim()||"#c93");
  const P=[...Array(110)].map(()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let f=0; const tick=()=>{ x.clearRect(0,0,innerWidth,innerHeight); P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();}); if(++f<90) requestAnimationFrame(tick); else cv.remove(); };
  tick();
}

/* ================= global events ================= */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-go],[data-map],[data-resume],[data-step],[data-open],[data-close],[data-break]"); if(!t) return;
  if(t.hasAttribute("data-close")){ closeLayer(); return; }
  if(t.hasAttribute("data-break")){ breakTimer(); return; }
  if(t.hasAttribute("data-open")){ drawer(t.dataset.open); return; }
  closeLayer();
  if(t.hasAttribute("data-map")) go("map");
  else if(t.hasAttribute("data-resume")) go("level", S.last.L, S.last.i);
  else if(t.hasAttribute("data-go")) go("level", +t.dataset.go, 0);
  else if(t.hasAttribute("data-step")){ cur.i=+t.dataset.step; S.last={L:cur.L,i:cur.i}; save(); stopSpeak(); render(); }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if($("#layer").innerHTML){ closeLayer(); return; } if(cur.view==="level") go("map"); return; }
  if(cur.view!=="level" || $("#layer").innerHTML) return;
  const tag=(e.target.tagName||"").toLowerCase(); if(["input","textarea","select"].includes(tag)) return;
  if(e.key==="ArrowRight"){ e.preventDefault(); step(1); } if(e.key==="ArrowLeft"){ e.preventDefault(); step(-1); }
});
$("#brand").onclick=()=>{ closeLayer(); go("map"); };
$("#setBtn").onclick=()=>drawer("settings");
$("#playBtn").onclick=()=>{ closeLayer(); tableOpen=!!(G&&!G.over&&tableOpen); go("practice"); };
$("#parkBtn").onclick=()=>drawer("park");

function render(){ if(cur.view==="level") renderLevel(); else if(cur.view==="practice") paint(); else renderMap(); renderMeter(); }

applySettings(); renderMeter(); fromHash();
})();
</script>
