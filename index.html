<!doctype html>
<html lang="en" data-theme="dark" data-motion="off">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app use the whole screen; safe-area padding keeps content clear of
         the notch and home bar. Zoom is NOT disabled: pinch-zoom is an accessibility feature. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Mana Steps: a calm, step-by-step way to learn to play Magic: The Gathering." />
    <meta name="theme-color" content="#15201B" />
    <!-- Installed (home-screen) app on iPhone and Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mana Steps" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Mana Steps</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
